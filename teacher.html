
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 스포츠 페스티벌 | 교사용</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f6fb;
      font-family: Arial, sans-serif;
      color: #17243b;
    }
    header {
      background: #183b73;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; font-size: 22px; }
    header p { margin: 0; font-size: 14px; }
    main { max-width: 480px; margin: 40px auto; padding: 16px; }
    .card {
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 4px 20px #17243b12;
    }
    h2 { margin-top: 0; font-size: 20px; }
    label { display: block; margin: 20px 0 8px; }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #183b73;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    #message { margin-top: 16px; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>2026 SPORTS FESTIVAL</h1>
    <p>교사용 경기 결과 입력 시스템</p>
  </header>

  <main>
    <section class="card">
      <h2>🔐 선생님 인증</h2>
      <p>경기 결과 입력을 위해 공통 비밀번호를 입력해 주세요.</p>

      <form id="loginForm">
        <label for="password">공통 비밀번호</label>
        <input
          id="password"
          type="password"
          placeholder="비밀번호 입력"
          autocomplete="off"
          required
        >
        <button type="submit">인증하기</button>
      </form>

      <p id="message" role="status"></p>
    </section>

<section id="resultSection" class="card" style="display:none; margin-top:20px;">
  <h2>🏆 경기 결과 입력</h2>
  <p>종목을 선택하고 경기 기록을 입력해 주세요.</p>

  <label for="sport">종목 선택</label>
  <select id="sport" style="width:100%; padding:14px; border:1px solid #cbd5e1; border-radius:9px; font-size:16px;">
    <option value="">종목을 선택하세요</option>
    <option value="dodgeball">피구</option>
    <option value="tug">줄다리기</option>
    <option value="rope">8자 줄넘기</option>
    <option value="threeLegged">2인 3각</option>
    <option value="mission">미션달리기</option>
  </select>


<div id="ropeInput" style="display:none; margin-top:24px;">
  <h3>🏅 8자 줄넘기 기록 입력</h3>
  <p>각 반의 1차·2차 기록을 입력해 주세요.</p>
  <p style="color:#64748b; font-size:14px;">
    두 번의 시도 중 높은 횟수를 최종 기록으로 반영합니다.
  </p>

  <div id="ropeClassInputs"></div>
  <button type="button" id="saveRopeButton">💾 8자 줄넘기 기록 저장</button>
<p id="ropeSaveMessage" role="status"></p>
</div>

<script>
  const ropeContainer = document.getElementById("ropeClassInputs");

  for (let classNum = 1; classNum <= 9; classNum++) {
    ropeContainer.innerHTML += `
      <div style="border:1px solid #e2e8f0; border-radius:10px;
                  padding:16px; margin-top:12px;">
        <h4>${classNum}반</h4>
       
<div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
  <div>
    <label for="rope-first-${classNum}">1차 시도 (회)</label>
    <input id="rope-first-${classNum}" type="number"
           min="0" step="1" placeholder="1차 기록">
  </div>
  <div>
    <label for="rope-second-${classNum}">2차 시도 (회)</label>
    <input id="rope-second-${classNum}" type="number"
           min="0" step="1" placeholder="2차 기록">
  </div>
</div>

      </div>
    `;
  }

  document.getElementById("sport").addEventListener("change", function () {
    document.getElementById("ropeInput").style.display =
      this.value === "rope" ? "block" : "none";
  });
</script>

</section>

  </main>

  
<script>
  const FUNCTION_URL =
    "https://tdrebwaendjrwqcfforx.supabase.co/functions/v1/festival-admin";

  let teacherPassword = "";
  
document.getElementById("saveRopeButton").addEventListener(
  "click",
  async function () {
    const button = this;
    const message = document.getElementById("ropeSaveMessage");

    if (!teacherPassword) {
      message.textContent = "먼저 선생님 인증을 해주세요.";
      return;
    }

    const records = [];

    for (let classNum = 1; classNum <= 9; classNum++) {
      const first = document.getElementById(
        `rope-first-${classNum}`
      ).value.trim();

      const second = document.getElementById(
        `rope-second-${classNum}`
      ).value.trim();

      if (first === "" && second === "") continue;

      const valid = (value) =>
        value === "" ||
        (Number.isInteger(Number(value)) && Number(value) >= 0);

      if (!valid(first) || !valid(second)) {
        message.textContent = `${classNum}반 기록을 확인해 주세요.`;
        message.style.color = "red";
        return;
      }

      records.push({
        classNum,
        first,
        second,
        best: Math.max(
          first === "" ? 0 : Number(first),
          second === "" ? 0 : Number(second)
        )
      });
    }

    if (records.length === 0) {
      message.textContent = "저장할 기록을 입력해 주세요.";
      message.style.color = "red";
      return;
    }

    button.disabled = true;
    message.style.color = "#17243b";
    message.textContent = "기록 저장 중...";

    let saved = 0;

    try {
      for (const record of records) {
        const response = await fetch(FUNCTION_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "save",
            password: teacherPassword,
            sport: "rope",
            match_id: `class_${record.classNum}`,
            class_number: record.classNum,
            result_value: record.best,
            winner_class: null
          })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(
            result.error || `${record.classNum}반 저장 실패`
          );
        }

        saved++;
      }

      message.textContent =
        `✅ ${saved}개 반의 최고 기록을 저장했습니다.`;
      message.style.color = "green";

    } catch (error) {
      message.textContent =
        `⚠️ ${saved}개 반 저장 후 오류: ${error.message}`;
      message.style.color = "red";
    } finally {
      button.disabled = false;
    }
  }
);


  document.getElementById("loginForm").addEventListener(
    "submit",
    async function (event) {
      event.preventDefault();

      const passwordInput = document.getElementById("password");
      const message = document.getElementById("message");
      const button = document.querySelector("#loginForm button");

      const password = passwordInput.value;

      button.disabled = true;
      message.textContent = "비밀번호 확인 중...";

      try {
        const response = await fetch(FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: "check",
            password: password
          })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.error || "인증에 실패했습니다.");
        }

        teacherPassword = password;
        passwordInput.value = "";
        message.textContent = "인증 성공! 선생님 환영합니다. ✅";
        message.style.color = "green";

        document.getElementById("loginForm").style.display = "none";
document.getElementById("resultSection").style.display = "block";
        
      } catch (error) {
        message.textContent =
          error.message || "서버 연결에 실패했습니다.";
        message.style.color = "red";
      } finally {
        button.disabled = false;
      }
    }
  );
</script>

</body>
</html>
